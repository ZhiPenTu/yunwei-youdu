version: '2'
services:
  # lianghua:
  #   build: .
  #   container_name: lianghua
  #   ports:
  #     - "5100:5100"
  #   links:
  #     - proxy_redis
  #     - postgres_db  # 添加对 PostgreSQL 数据库的链接
  #   environment:
  #     DB_CONN: "redis://@proxy_redis:6379/0"
  #     POSTGRES_CONN: "postgresql+psycopg2://postgres:123456@postgres_db:5432/postgres"  # 添加 PostgreSQL 连接信息
  lianghua_redis:
    image: "redis"
    container_name: lianghua_redis
    environment:
      TZ: "Asia/Shanghai"  # 设置时区为上海时区
    volumes:
      - lianghua-redis-pvc:/data  # 使用 lianghua-redis-pvc 卷
  postgres_db:
    image: "postgres:latest"  # 使用 PostgreSQL 最新镜像
    container_name: postgres_db
    environment:
      POSTGRES_PASSWORD: "123456"  # 设置数据库密码
      POSTGRES_DB: "postgres"  # 设置默认数据库名
      TZ: "Asia/Shanghai"  # 设置时区为上海时区
    ports:
      - "5432:5432"  # 暴露 PostgreSQL 端口,允许远程访问
    volumes:
      - lianghua-postgresql-pvc:/var/lib/postgresql/data  # 使用 lianghua-postgresql-pvc 卷

volumes:
  lianghua-redis-pvc:
  lianghua-postgresql-pvc:

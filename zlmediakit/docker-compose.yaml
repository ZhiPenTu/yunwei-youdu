version: '3'
services:
  zlmediakit:
    image: zlmediakit/zlmediakit:master
    container_name: zlmediakit
    restart: always
    environment:
      - MODE=standalone
      - TZ="Asia/Shanghai"
    ports:
      - "1935:1935"
      - "8080:80"
      - "8554:554"
      - "10000:10000"
      - "10000:10000/udp"
      - "8000:8000/udp"
      - "30000-30500:30000-30500"
      - "30000-30500:30000-30500/udp"
    volumes:
      - /data/zlmediakit/media/conf:/opt/media/conf
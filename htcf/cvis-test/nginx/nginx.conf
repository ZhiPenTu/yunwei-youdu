

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index  index.html index.htm;
        }

        location ^~/api {
            rewrite  ^/api/(.*)$ /$1 break;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://htcf_iot_test:82/;
        }
        location ^~/dtd {
            rewrite  ^/api/(.*)$ /$1 break;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://htcf_iot_test:82/;
        }

        location ^~/vue-router@3.1.3/dist {
            rewrite  ^/vue-router@3.1.3/dist/(.*)$ /$1 break;
            root /data/cvis-test/vue;
        }

        location ^~/vue@2.6.10/dist {
            rewrite  ^/vue@2.6.10/dist/(.*)$ /$1 break;
            root /data/cvis-test/vue;
        }

        location ^~/axios@0.19.0/dist {
            rewrite  ^/axios@0.19.0/dist/(.*)$ /$1 break;
            root /data/cvis-test/vue;
        }

        location ^~/vuex@3.1.1/dist {
            rewrite  ^/vuex@3.1.1/dist/(.*)$ /$1 break;
            root /data/cvis-test/vue;
        }

        # 避免actuator暴露
        if ($uri ~ "/actuator") {
            return 403;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}